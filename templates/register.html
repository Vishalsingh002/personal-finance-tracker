{% extends 'base.html' %}
{% block title %}Register - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-block mb-2"><i class="bi bi-person-plus fs-2"></i></div>
                    <h3 class="fw-bold">Create Account</h3>
                </div>
                <form action="/register" method="POST">
                    <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
                    <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" minlength="6" required></div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign Up</button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted small">Already have an account? </span><a href="/login" class="small fw-bold text-primary text-decoration-none">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
