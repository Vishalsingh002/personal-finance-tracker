{% extends 'base.html' %}
{% block title %}Profile - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="row g-4 justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mb-3 text-center p-4">
            <div class="bg-dark text-white p-3 rounded-circle d-inline-block mx-auto mb-2"><i class="bi bi-person fs-1"></i></div>
            <h4 class="fw-bold mb-0">{{ user.username }}</h4>
            <p class="text-muted small">{{ user.email }}</p>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold py-3"><i class="bi bi-bullseye text-warning me-2"></i>Default Monthly Budget</div>
            <div class="card-body">
                <form action="/profile" method="POST">
                    <input type="hidden" name="action" value="update_budget">
                    <div class="mb-3">
                        <label class="form-label">Budget ($)</label>
                        <input type="number" step="0.01" min="0" name="monthly_budget" class="form-control" value="{{ user.monthly_budget or 0.0 }}" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-semibold">Save Budget</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold py-3"><i class="bi bi-shield-lock text-primary me-2"></i>Change Password</div>
            <div class="card-body">
                <form action="/profile" method="POST">
                    <input type="hidden" name="action" value="change_password">
                    <div class="mb-3"><label class="form-label">Current Password</label><input type="password" name="current_password" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control" minlength="6" required></div>
                    <button type="submit" class="btn btn-primary fw-semibold">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
