{% extends "base.html" %}

{% block title %}Reset Password - FinanceTracker AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-warning bg-opacity-10 text-warning rounded-circle mb-3">
            <i class="fas fa-shield-alt fs-3 text-warning"></i>
          </div>
          <h3 class="fw-bold">Forgot Password</h3>
          <p class="text-muted small">Verify your username & email to set a new password.</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Your username" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Registered Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" name="new_password" class="form-control" minlength="6" placeholder="At least 6 characters" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" name="confirm_password" class="form-control" minlength="6" placeholder="Re-enter password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold mt-2">
            <i class="fas fa-redo me-1"></i> Reset Password
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            Remember your password? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
