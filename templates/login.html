{% extends "base.html" %}

{% block title %}Login - FinanceTracker AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-3">
            <i class="fas fa-lock fs-3"></i>
          </div>
          <h3 class="fw-bold">Sign In</h3>
          <p class="text-muted small">Welcome back! Please enter your details.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold mb-0">Password</label>
              <!-- Forgot Password Link -->
              <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none fw-semibold">
                Forgot Password?
              </a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-key text-muted"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
            <i class="fas fa-sign-in-alt me-1"></i> Sign In
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted small mb-0">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
